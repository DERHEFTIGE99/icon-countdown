name: Icon Countdown

# Duels-Event Sa 28.11.2026 15:00 MEZ. Countdown ab Fr 27.11. 15:00 MEZ (Sparmodus, siehe schedule).
on:
  push:                       # Push = Einzel-Lauf (setzt nur die gerade passende Stufe, z.B. Test des Original-Icons)
    branches: [main]
  schedule:
    # SPARMODUS (privates Repo, wenig Actions-Minuten): kein Dauerlauf, sondern Kurzlaeufe.
    # Alle Zeiten UTC (MEZ = UTC+1). Lauf um :52 wartet bis zum Wechsel (:59), Lauf um :05 holt Verpasstes nach.
    - cron: "52 13-23 27 11 *"          # Fr: 24 HOURS ... 15 HOURS
    - cron: "5 14-23 27 11 *"
    - cron: "52 0-12 28 11 *"           # Sa: 14 HOURS ... 1 HOUR
    - cron: "5 0-13 28 11 *"
    - cron: "22,37,47,56 13 28 11 *"    # Sa: 30 / 15 / 5 MINUTES, NOW (je ~7 bzw. 3 Min. vor dem Wechsel)
    - cron: "5,30 14 28 11 *"           # Sa: NOW nachpruefen
    - cron: "52 15 28 11 *"             # Sa 16:59 MEZ: zurueck aufs Original-Icon
    - cron: "10,25,40 16 28 11 *"       # Original-Icon nachpruefen, danach schaltet sich der Workflow ab
  workflow_dispatch:          # manuell starten = Dauerlauf (setzt jeden Wechsel selbst, startet sich neu)
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts aendern"
        type: boolean
        default: false
      loop_minutes:
        description: "Laufzeit pro Dauerlauf in Minuten (nur zum Testen aendern)"
        type: string
        default: "330"
      restarts_left:
        description: "Wie oft sich der Dauerlauf noch neu starten darf (nur zum Testen aendern)"
        type: string
        default: "999"

permissions:
  actions: write   # Neustart des Dauerlaufs + Selbst-Abschalten nach dem Event
  contents: read

jobs:
  update-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Kurzlaeufe brauchen max. ~12 Min.
    steps:
      - uses: actions/checkout@v4
      - name: Icon setzen
        id: run
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          LOOP_MINUTES: ${{ inputs.loop_minutes }}
        run: python3 -u icon_countdown.py ${{ github.event_name == 'workflow_dispatch' && '--loop' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ contains(github.event.head_commit.message, '[icon-test]') && '--test-icons' || '' }}
      - name: Dauerlauf neu starten
        if: steps.run.outputs.restart == 'true' && inputs.restarts_left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ inputs.restarts_left || '999' }}
        run: >
          gh workflow run icon-countdown.yml --repo "$GITHUB_REPOSITORY" --ref main
          -f dry_run=${{ inputs.dry_run && 'true' || 'false' }}
          -f loop_minutes=${{ inputs.loop_minutes || '330' }}
          -f restarts_left=$((LEFT - 1))
      - name: Nach dem Event abschalten
        if: steps.run.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Icon Countdown" --repo "$GITHUB_REPOSITORY"
