name: Icon Countdown

on:
  schedule:
    - cron: "*/5 * * * *"   # Reserve: Einzel-Lauf alle 5 Minuten (GitHub startet das oft verspaetet)
  workflow_dispatch:          # manuell starten = Dauerlauf (setzt jeden Wechsel selbst, startet sich neu)
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts aendern"
        type: boolean
        default: false

permissions:
  actions: write   # Neustart des Dauerlaufs + Selbst-Abschalten nach dem Event
  contents: read

jobs:
  update-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Icon setzen
        id: run
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 -u icon_countdown.py ${{ github.event_name == 'workflow_dispatch' && '--loop' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Dauerlauf neu starten
        if: steps.run.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run icon-countdown.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Nach dem Event abschalten
        if: steps.run.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "Icon Countdown" --repo "$GITHUB_REPOSITORY"
